<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <!-- Symbol Group (White on Navy / Light Blue Accents) -->
  <g transform="translate(6, 6) scale(0.52)">
    <!-- Orbital Ring -->
    <ellipse cx="50" cy="54" rx="44" ry="19" transform="rotate(-12 50 54)" stroke="#60A5FA" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
    <circle cx="8" cy="62" r="3" fill="#60A5FA" />
    <circle cx="92" cy="46" r="3" fill="#60A5FA" />
    <circle cx="50" cy="73" r="2.5" fill="#60A5FA" />

    <!-- Open Book -->
    <path d="M 50 78 C 37 78 21 73 14 65 C 14 54 14 42 14 42 C 22 49 37 53 50 55 Z" fill="#FFFFFF" />
    <path d="M 50 78 C 63 78 79 73 86 65 C 86 54 86 42 86 42 C 78 49 63 53 50 55 Z" fill="#F1F5F9" />
    <line x1="50" y1="55" x2="50" y2="78" stroke="#0B1E3F" stroke-width="1.5" stroke-linecap="round" />

    <!-- Rising Analytics Bars -->
    <rect x="36" y="44" width="5.5" height="15" rx="2.75" fill="#3B82F6" />
    <rect x="47.25" y="36" width="5.5" height="23" rx="2.75" fill="#60A5FA" />
    <rect x="58.5" y="27" width="5.5" height="32" rx="2.75" fill="#93C5FD" />

    <!-- Graduation Cap -->
    <polygon points="50,11 74,21 50,31 26,21" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.2" />
    <path d="M 37 26.5 C 37 34 63 34 63 26.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 74 21 L 79 28 L 79 34" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="79" cy="35" r="1.5" fill="#60A5FA" />

    <!-- Intelligent Spark -->
    <path d="M 80 8 Q 80 14 86 14 Q 80 14 80 20 Q 80 14 74 14 Q 80 14 80 8 Z" fill="#60A5FA" />
    <circle cx="80" cy="14" r="1.2" fill="#FFFFFF" />
  </g>

  <!-- Typography: Pure White Wordmark AUVRYN -->
  <text x="70" y="36" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="2.5" fill="#FFFFFF">AUVRYN</text>
  
  <circle cx="216" cy="22" r="3" fill="#60A5FA" />

  <!-- Descriptor: Light Blue Accent -->
  <text x="71" y="49" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.8" fill="#93C5FD">THE INTELLIGENT EDUCATION ECOSYSTEM</text>
</svg>
