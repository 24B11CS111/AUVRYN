<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="auvryn-navy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1E3F" />
      <stop offset="100%" stop-color="#142C4C" />
    </linearGradient>
    <linearGradient id="auvryn-blue-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Orbital Ring (Technology & Ecosystem) -->
  <ellipse cx="50" cy="54" rx="44" ry="19" transform="rotate(-12 50 54)" stroke="#2563EB" stroke-width="1.75" stroke-dasharray="3 3" opacity="0.45" />
  
  <!-- Orbital Nodes -->
  <circle cx="8" cy="62" r="2.5" fill="#2563EB" />
  <circle cx="92" cy="46" r="2.5" fill="#2563EB" />
  <circle cx="50" cy="73" r="2" fill="#2563EB" opacity="0.7" />

  <!-- Open Book Base (Education & Knowledge) -->
  <!-- Left Page -->
  <path d="M 50 78 C 37 78 21 73 14 65 C 14 54 14 42 14 42 C 22 49 37 53 50 55 Z" fill="url(#auvryn-navy-grad)" />
  <!-- Right Page -->
  <path d="M 50 78 C 63 78 79 73 86 65 C 86 54 86 42 86 42 C 78 49 63 53 50 55 Z" fill="#0B1E3F" />
  <!-- Center Book Spine Line -->
  <line x1="50" y1="55" x2="50" y2="78" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round" />

  <!-- Rising Analytics Bars (Progress & Analytics) -->
  <rect x="36" y="44" width="5.5" height="15" rx="2.75" fill="url(#auvryn-blue-grad)" />
  <rect x="47.25" y="36" width="5.5" height="23" rx="2.75" fill="#2563EB" />
  <rect x="58.5" y="27" width="5.5" height="32" rx="2.75" fill="url(#auvryn-blue-grad)" />

  <!-- Graduation Cap (Academic Achievement) -->
  <polygon points="50,11 74,21 50,31 26,21" fill="#07152B" stroke="#2563EB" stroke-width="1.2" />
  <path d="M 37 26.5 C 37 34 63 34 63 26.5" fill="none" stroke="#07152B" stroke-width="2.5" stroke-linecap="round" />
  <!-- Cap Tassel -->
  <path d="M 74 21 L 79 28 L 79 34" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="79" cy="35" r="1.5" fill="#2563EB" />

  <!-- Intelligent Spark (AI & Innovation) -->
  <path d="M 80 8 Q 80 14 86 14 Q 80 14 80 20 Q 80 14 74 14 Q 80 14 80 8 Z" fill="#2563EB" />
  <circle cx="80" cy="14" r="1.2" fill="#FFFFFF" />
</svg>
